services:
  - type: web
    name: econlls-api
    runtime: node
    region: singapore
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Colombo
      - key: TRUST_PROXY
        value: "1"

      # The frontend Render origin, without a trailing slash.
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false

      # Render terminates TLS before forwarding requests to Express.
      # Separate onrender.com frontend/API services need a cross-site cookie.
      - key: COOKIE_NAME
        value: econlls_auth
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_MAX_AGE_DAYS
        value: "7"

      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: OTP_EXPIRES_MINUTES
        value: "10"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"

      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GDRIVE_PAYMENT_SLIPS_FOLDER_ID
        sync: false
      - key: GDRIVE_NIC_DOCUMENTS_FOLDER_ID
        sync: false

      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_LINK_ENCRYPTION_KEY
        sync: false
      - key: ZOOM_DEFAULT_JOIN_BEFORE_MINUTES
        value: "30"
      - key: ZOOM_DEFAULT_JOIN_AFTER_MINUTES
        value: "15"

      - key: DEFAULT_LESSON_MAX_VIEWS
        value: "2"
      - key: PLAYBACK_HEARTBEAT_SECONDS
        value: "20"
      - key: PLAYBACK_STALE_MINUTES
        value: "3"
      - key: PAYMENT_SLIP_MAX_MB
        value: "5"
      - key: NIC_IMAGE_MAX_MB
        value: "5"
      - key: REQUEST_BODY_LIMIT
        value: 1mb
      - key: GLOBAL_RATE_LIMIT_MAX
        value: "300"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: OTP_SEND_RATE_LIMIT_MAX
        value: "5"
      - key: UPLOAD_RATE_LIMIT_MAX
        value: "20"
      - key: BILLING_CRON_TEST_MODE
        value: "false"

  - type: web
    name: econlls-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # The public API URL including /api, for example:
      # https://econlls-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
